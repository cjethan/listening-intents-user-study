# docker-compose.yml

services:
  postgres:
    image: postgres:17
    container_name: postgres_songsdb
    restart: always
    environment:
      POSTGRES_USER: intent
      POSTGRES_PASSWORD: [removed]
      POSTGRES_DB: intentdb
    ports:
      - "5432:5432" #localhost:5432 todo oder weg?
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

volumes:
  pgdata:
